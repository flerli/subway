server {
  listen 80;
  server_name _;
  client_max_body_size 500m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Offline STT/TTS weights: never fall back to index.html.
  # Missing model files MUST 404 loudly so staging drift surfaces as a real
  # 404 (transformers.js then reports model-missing) instead of a 200 HTML
  # page that fails JSON parsing invisibly.
  location ^~ /voice-models/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
